name: Build and release HackerCode

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackercode-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact: hackercode-linux-x64
          - name: Windows x64
            os: windows-2022
            platform: win32
            arch: x64
            artifact: hackercode-windows-x64
          - name: macOS arm64
            os: macos-26-xlarge
            platform: darwin
            arch: arm64
            artifact: hackercode-macos-arm64
            gyp_defines: kerberos_use_rtld=false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      npm_config_arch: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.arch }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      GYP_DEFINES: ${{ matrix.gyp_defines }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-dev libkrb5-dev

      - name: Install build dependencies
        run: npm ci --prefix build

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: |
          source ./build/azure-pipelines/linux/setup-env.sh
          npm ci

      - name: Setup macOS build tools
        if: runner.os == 'macOS'
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install dependencies
        if: runner.os != 'Linux'
        env:
          npm_config_foreground_scripts: "true"
        run: npm ci

      - name: Add Windows SDK tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Append'

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Compile application
        run: npm run gulp core-ci

      - name: Package built-in Copilot extension
        run: npm run gulp compile-copilot-extension-build

      - name: Build packaged application
        run: npm run gulp vscode-${{ matrix.platform }}-${{ matrix.arch }}-min-ci

      - name: Archive Linux build
        if: runner.os == 'Linux'
        run: tar -czf HackerCode-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Archive Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ..\VSCode-win32-x64\* -DestinationPath HackerCode-windows-x64.zip

      - name: Archive macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent ../VSCode-darwin-arm64 HackerCode-macos-arm64.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: HackerCode-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download packaged applications
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hackercode-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum HackerCode-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="v${VERSION}-${SHORT_SHA}"
          TITLE="HackerCode ${VERSION} (${SHORT_SHA})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              --prerelease
          fi
