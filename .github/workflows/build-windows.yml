name: Build HackerCode for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VSCODE_ARCH: x64
  npm_config_arch: x64

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout HackerCode
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows-build
          key-args: "win32 ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              exec { npm ci }
              break
            } catch {
              if ($attempt -eq 5) {
                throw
              }

              Write-Host "npm ci failed on attempt $attempt; retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_foreground_scripts: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native optional dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: node build/azure-pipelines/common/checkNativeOptionalDeps.ts

      - name: Save node_modules cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: built-in-extensions-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: builtin-extensions-${{ hashFiles('.build/builtindepshash') }}

      - name: Download built-in extensions
        if: steps.built-in-extensions-cache.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save built-in extensions cache
        if: steps.built-in-extensions-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: builtin-extensions-${{ hashFiles('.build/builtindepshash') }}

      - name: Set automatic build version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $base = [System.Version]$package.version
          $version = "$($base.Major).$($base.Minor).${{ github.run_number }}"

          $env:HACKERCODE_VERSION = $version
          node -e "const fs = require('fs'); const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8')); packageJson.version = process.env.HACKERCODE_VERSION; fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');"

          "HACKERCODE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building HackerCode $version"

      - name: Add Windows SDK tools to PATH
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $sdk = Get-ChildItem $kits -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "x64\signtool.exe") } |
            Sort-Object { [System.Version]$_.Name } -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "Unable to find the Windows SDK signing tools"
          }

          (Join-Path $sdk.FullName "x64") >> $env:GITHUB_PATH

      - name: Build Windows application
        shell: pwsh
        run: npm run gulp -- vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unsigned installers
        shell: pwsh
        run: |
          npm run gulp -- vscode-win32-x64-system-setup
          npm run gulp -- vscode-win32-x64-user-setup

      - name: Stage artifacts
        shell: pwsh
        run: |
          $output = "dist\windows"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          Copy-Item ".build\win32-x64\system-setup\VSCodeSetup.exe" "$output\HackerCodeSetup-x64-$env:HACKERCODE_VERSION.exe"
          Copy-Item ".build\win32-x64\user-setup\VSCodeSetup.exe" "$output\HackerCodeUserSetup-x64-$env:HACKERCODE_VERSION.exe"
          7z.exe a -tzip "$output\HackerCode-win32-x64-$env:HACKERCODE_VERSION.zip" "..\VSCode-win32-x64\*"

      - name: Upload Windows installers and portable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hackercode-windows-x64-${{ steps.version.outputs.version }}
          path: dist/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summarize build
        shell: pwsh
        run: |
          "### HackerCode $env:HACKERCODE_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "The Windows x64 system installer, user installer, and portable ZIP are available in the workflow artifact." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "> The installers are unsigned and may trigger a Windows SmartScreen warning." >> $env:GITHUB_STEP_SUMMARY
